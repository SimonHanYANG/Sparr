# Full local deployment (PLAN.md §11.1 版本 A): postgres + redis + django + celery + nginx frontend
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparr
      POSTGRES_PASSWORD: sparr
      POSTGRES_DB: sparr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgres://sparr:sparr@db:5432/sparr
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: ./backend
    command: uv run celery -A config worker -l info
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: postgres://sparr:sparr@db:5432/sparr
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
