# Development stack: postgres + redis + Django + Vite hot-reload (PLAN.md §11.3)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sparr
      POSTGRES_PASSWORD: sparr
      POSTGRES_DB: sparr
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uv run python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://sparr:sparr@db:5432/sparr
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: ./backend
    command: uv run celery -A config worker -l info
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    env_file: .env
    environment:
      DATABASE_URL: postgres://sparr:sparr@db:5432/sparr
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_MODE: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:24-slim
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_venv:
  frontend_node_modules:
